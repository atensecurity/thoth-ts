name: Release @atensec/thoth

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.19 or 0.1.19-rc1)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and release to npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@atensec/thoth
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Upgrade npm for Trusted Publishing
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          node --version
          npm --version

      - name: Resolve version from tag or input
        id: version
        shell: bash
        env:
          TAG_REF: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION#v}"
            TAG="v${VERSION}"
          else
            TAG="${TAG_REF}"
            VERSION="${TAG_REF#v}"
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "Invalid version '${VERSION}'. Expected semantic version like 0.1.19 or 0.1.19-rc1." >&2
            exit 1
          fi

          if [[ "${VERSION}" =~ -rc[0-9]+$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Validate package version matches release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${PACKAGE_VERSION}" != "${VERSION}" ]]; then
            echo "::error::package.json version (${PACKAGE_VERSION}) does not match release version (${VERSION})."
            exit 1
          fi

      - name: Validate changelog entry exists
        id: changelog
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          BASE_VERSION="${VERSION%-rc*}"
          CANDIDATES=("${VERSION}")
          if [[ "${BASE_VERSION}" != "${VERSION}" ]]; then
            CANDIDATES+=("${BASE_VERSION}")
          fi

          MATCHED_VERSION=""
          START_LINE=""
          for candidate in "${CANDIDATES[@]}"; do
            CANDIDATE_RE="$(printf '%s' "${candidate}" | sed -E 's/[][(){}.^$*+?|\\/]/\\&/g')"
            START_LINE="$(
              grep -nE "^##[[:space:]]+v?${CANDIDATE_RE}[[:space:]]+-[[:space:]]+[0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]*$" CHANGELOG.md \
                | head -n1 \
                | cut -d: -f1 \
                || true
            )"
            if [[ -n "${START_LINE}" ]]; then
              MATCHED_VERSION="${candidate}"
              break
            fi
          done

          if [[ -z "${START_LINE}" ]]; then
            echo "::error::Missing CHANGELOG entry for ${VERSION} in CHANGELOG.md"
            if [[ "${BASE_VERSION}" != "${VERSION}" ]]; then
              echo "::error::Expected heading format: ## ${VERSION} - YYYY-MM-DD (or fallback ## ${BASE_VERSION} - YYYY-MM-DD)"
            else
              echo "::error::Expected heading format: ## ${VERSION} - YYYY-MM-DD"
            fi
            exit 1
          fi

          if [[ "${MATCHED_VERSION}" != "${VERSION}" ]]; then
            echo "Using CHANGELOG entry ${MATCHED_VERSION} for prerelease ${VERSION}."
          fi

          NOTES="$(
            awk -v start_line="${START_LINE}" '
              NR < start_line { next }
              NR > start_line && $1 == "##" { exit }
              { print }
            ' CHANGELOG.md
          )"

          {
            echo "notes<<EOF"
            echo "${NOTES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Run typecheck, tests, and build
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Pack release artifact
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          TAR_FILE="$(npm pack --silent)"
          echo "tar_file=${TAR_FILE}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (Trusted Publisher)
        shell: bash
        env:
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
        run: |
          set -euo pipefail
          # Force Trusted Publisher OIDC path and avoid npm token auth fallback.
          unset NODE_AUTH_TOKEN
          unset NPM_TOKEN
          if [[ -n "${NPM_CONFIG_USERCONFIG:-}" ]]; then
            rm -f "${NPM_CONFIG_USERCONFIG}"
          fi
          rm -f "${HOME}/.npmrc"
          npm publish --provenance --access public --tag "${NPM_TAG}"

      - name: Create or update GitHub release from changelog
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ steps.changelog.outputs.notes }}
          TAR_FILE: ${{ steps.pack.outputs.tar_file }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' "${NOTES}" > release_notes.md

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${TAR_FILE}" --clobber
            gh release edit "${TAG}" --notes-file release_notes.md
            RELEASE_ID="$(gh release view "${TAG}" --json id --jq '.id')"
            gh api -X PATCH "repos/${REPO}/releases/${RELEASE_ID}" \
              -f prerelease="${IS_PRERELEASE}"
          else
            prerelease_flag=""
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              prerelease_flag="--prerelease"
            fi
            gh release create "${TAG}" \
              --title "@atensec/thoth ${TAG}" \
              --notes-file release_notes.md \
              ${prerelease_flag} \
              "${TAR_FILE}"
          fi
